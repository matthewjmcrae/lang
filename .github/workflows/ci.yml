name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Configure LLVM tools (macOS)
        if: runner.os == 'macOS'
        run: |
          llvm_bin="$(brew --prefix llvm)/bin"
          echo "LLVM_BIN=${llvm_bin}" >> "$GITHUB_ENV"
          echo "${llvm_bin}" >> "$GITHUB_PATH"

      - name: Configure LLVM tools (Linux)
        if: runner.os == 'Linux'
        run: |
          llvm_bin="$(llvm-config --bindir)"
          echo "LLVM_BIN=${llvm_bin}" >> "$GITHUB_ENV"
          echo "${llvm_bin}" >> "$GITHUB_PATH"

      - name: Verify LLVM tools
        run: |
          clang --version
          opt --version

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build compiler
        run: cmake --build build --parallel

      - name: Run compiler test suite
        run: NORIA_REQUIRE_LLVM_TOOLS=1 ctest --test-dir build --output-on-failure --no-tests=error
