name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install LLVM
        run: brew install llvm

      - name: Configure LLVM tools
        run: echo "LLVM_BIN=$(brew --prefix llvm)/bin" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build compiler
        run: cmake --build build

      - name: Run compiler test suite
        run: BUILD_DIR=build ./tests/run_examples.sh
